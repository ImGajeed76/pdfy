<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PDFy" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PDFy",
        "applicationCategory": "DeveloperTool",
        "operatingSystem": "Web Browser",
        "description": "PDFy transforms your source code and project files into clean, searchable, text-based PDFs with syntax highlighting — all securely in your browser. Ideal for code to PDF and multiple files to PDF tasks.",
        "abstract": "A free tool to convert code and source files into text-based, searchable PDFs with syntax highlighting, operating locally in the browser for maximum privacy.",
        "url": "https://pdfy.oseifert.ch/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "keywords": "code to pdf, source to pdf, multiple files to pdf, searchable pdf,syntax highlighting, developer tool, local processing, print code, project documentation, pdfy",
        "creator": {
          "@type": "Person",
          "name": "Oliver Seifert",
          "url": "https://oseifert.ch/"
        }
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
